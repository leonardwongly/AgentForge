name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agentforge:agentforge@localhost:5432/agentforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      # Dependencies are never allowed to execute lifecycle hooks on CI hosts;
      # required generators/build steps are invoked explicitly below.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm messaging:validate
      - run: pnpm policy:validate fixtures/policies/fintech.yaml
      - run: pnpm policy:preview fixtures/policies/fintech.yaml fixtures/repos/billing-agent.json
      - run: pnpm fixtures:run
      - run: pnpm test -- --coverage
      - run: pnpm build
      - run: pnpm prisma:validate
