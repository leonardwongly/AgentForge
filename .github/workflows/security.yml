name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Repository hygiene scan
        run: |
          tracked_artifacts="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)playwright-report/|(^|/)test-results/' || true)"
          if [ -n "$tracked_artifacts" ]; then
            echo "Generated local artifacts must not be committed:"
            echo "$tracked_artifacts"
            exit 1
          fi
      - name: Secret scan
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY-----' -- . ':!**/*.test.ts' ':!fixtures/repos/secret-like-token.json' ':!packages/security/src/redaction.ts' ':!.github/workflows/security.yml'; then
            exit 1
          fi
      - run: pnpm --filter @agentforge/security test
