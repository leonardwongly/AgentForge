name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate
      - run: pnpm release:check
      - name: Repository hygiene scan
        run: |
          tracked_artifacts="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)playwright-report/|(^|/)test-results/' || true)"
          if [ -n "$tracked_artifacts" ]; then
            echo "Generated local artifacts must not be committed:"
            echo "$tracked_artifacts"
            exit 1
          fi
      - name: Secret scan
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY-----|xox[bpras]-[0-9]{10,}|sk_live_[A-Za-z0-9]{20,}|rk_live_[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{22,}|npm_[A-Za-z0-9]{36}|pypi-[A-Za-z0-9_-]{50,}|sk-[A-Za-z0-9]{20,}' -- . ':!fixtures/repos/secret-like-token.json' ':!packages/security/src/redaction.ts' ':!.github/workflows/security.yml'; then
            exit 1
          fi
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: 8.28.0
          # Configure this immutable artifact digest as an Actions repository
          # variable. The job fails closed if the variable is absent or does
          # not match the release checksum.
          GITLEAKS_PINNED_SHA256: ${{ vars.GITLEAKS_PINNED_SHA256 }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${asset}" -o /tmp/gitleaks.tar.gz
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          # Verify the downloaded tarball against the release-published checksums.
          expected="$(grep " ${asset}\$" /tmp/gitleaks_checksums.txt | awk '{print $1}')"
          if [ -z "${expected}" ]; then
            echo "::error::No checksum entry found for ${asset}"; exit 1
          fi
          if ! printf '%s' "${GITLEAKS_PINNED_SHA256}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::GITLEAKS_PINNED_SHA256 repository variable must be a 64-character SHA-256 digest"; exit 1
          fi
          if [ "${GITLEAKS_PINNED_SHA256}" != "${expected}" ]; then
            echo "::error::Published checksum does not match pinned digest"; exit 1
          fi
          echo "${GITLEAKS_PINNED_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          # Extract and run as the unprivileged runner user (no sudo / no root install).
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "${RUNNER_TEMP}/bin" gitleaks
          chmod +x "${RUNNER_TEMP}/bin/gitleaks"
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          gitleaks detect --source . --redact --config .gitleaks.toml --verbose
      - run: pnpm --filter @agentforge/security test
