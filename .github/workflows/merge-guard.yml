name: Merge Guard

# AgentForge governing its own repository: the deterministic engine
# (detectors + .agentforge/policy.yml) evaluates every pull request and
# publishes the "AgentForge Merge Guard" check. The job exits non-zero only
# when the policy decision is `block` (enforce mode with unresolved
# requirements); in `warn` mode it reports findings without blocking.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merge-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-guard:
    name: AgentForge Merge Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Evaluate pull request with AgentForge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm merge-guard
      - name: Upload Change Control Record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-guard-change-control-record
          path: merge-guard-record.json
          if-no-files-found: warn
          retention-days: 90
