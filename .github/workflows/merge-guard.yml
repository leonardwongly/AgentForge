name: Merge Guard

# AgentForge governing its own repository: the deterministic engine
# (detectors + .agentforge/policy.yml) evaluates every pull request and
# publishes the "AgentForge Merge Guard" check. The job exits non-zero only
# when the policy decision is `block` (enforce mode with unresolved
# requirements); in `warn` mode it reports findings without blocking.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-guard:
    name: AgentForge Merge Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Evaluate pull request with AgentForge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm merge-guard
