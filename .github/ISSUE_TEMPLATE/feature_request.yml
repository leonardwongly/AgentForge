name: Feature request
description: Propose a product, platform, or policy improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and operations
      description: Note auth, tenant, data retention, privacy, performance, migration, and rollback concerns.
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: What tests or acceptance checks would prove this works?
