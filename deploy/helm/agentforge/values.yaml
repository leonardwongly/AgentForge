# AgentForge Helm chart values.
# Production requires secrets (see values-secrets.example or --set flags) and a
# fail-closed configuration. Review docs/self-hosting.md before deploying.

image:
  repository: agentforge
  tag: "1.2.0"
  # Pin production images by digest; install fails if digest is omitted.
  digest: ""
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Bring your own Postgres/Redis, or let the chart provision them.
postgresql:
  enabled: true
  imageDigest: ""
  auth:
    database: agentforge
    username: agentforge
    password: "" # set via --set postgresql.auth.password or a secret
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    port: 5432

redis:
  enabled: true
  imageDigest: ""
  auth:
    password: "" # set via --set redis.auth.password or a secret
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  service:
    port: 6379

api:
  replicaCount: 1
  port: 4000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

web:
  replicaCount: 1
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

ingress:
  enabled: false
  className: ""
  host: ""
  tls:
    enabled: true
    secretName: ""

# Application configuration. Secrets are mounted from the `agentforge-secrets`
# secret; non-secret values come from the `agentforge-config` ConfigMap.
config:
  nodeEnv: production
  appBaseUrl: ""
  apiBaseUrl: ""
  defaultPolicyMode: observe
  sourceCodeStorage: "false"
  fullDiffRetention: disabled
  redactSecrets: "true"
  llmFeatures: "false"
  auditRecordRetentionDays: "90"
  apiTrustProxyHeaders: "true"
  dashboardTrustProxyHeaders: "true"
  authProxyStripsHeaders: "true"

# Set these via --set or a values file; never commit real secrets.
secrets:
  databaseUrl: ""
  redisUrl: ""
  githubAppId: ""
  githubAppPrivateKey: ""
  githubAppSlug: ""
  githubWebhookSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  sessionSecret: ""
  apiProxySecret: ""
  dashboardProxySecret: ""

networkPolicy:
  enabled: true
