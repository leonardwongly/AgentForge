apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentforge.fullname" . }}-secrets
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}
  {{ end }}
  {{ if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ required "redis.auth.password is required" .Values.redis.auth.password | quote }}
  {{ end }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ required "secrets.githubAppPrivateKey is required" .Values.secrets.githubAppPrivateKey | quote }}
  GITHUB_APP_SLUG: {{ .Values.secrets.githubAppSlug | quote }}
  GITHUB_WEBHOOK_SECRET: {{ required "secrets.githubWebhookSecret is required" .Values.secrets.githubWebhookSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  SESSION_SECRET: {{ required "secrets.sessionSecret is required" .Values.secrets.sessionSecret | quote }}
  AGENTFORGE_API_PROXY_SECRET: {{ required "secrets.apiProxySecret is required" .Values.secrets.apiProxySecret | quote }}
  AGENTFORGE_DASHBOARD_PROXY_SECRET: {{ required "secrets.dashboardProxySecret is required" .Values.secrets.dashboardProxySecret | quote }}
