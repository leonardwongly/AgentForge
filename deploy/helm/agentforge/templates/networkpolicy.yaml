{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentforge.fullname" . }}-postgres
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              {{- include "agentforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentforge.fullname" . }}-redis
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              {{- include "agentforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
