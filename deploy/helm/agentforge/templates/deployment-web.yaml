apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentforge.fullname" . }}-web
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "agentforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ required \"image.digest is required; pin an immutable image\" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start:web"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          envFrom:
            - configMapRef:
                name: {{ include "agentforge.fullname" . }}-config
          env:
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: GITHUB_APP_ID } }
            - name: GITHUB_APP_SLUG
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: GITHUB_APP_SLUG } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: SESSION_SECRET } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: GITHUB_CLIENT_ID } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: GITHUB_CLIENT_SECRET } }
            - name: AGENTFORGE_DASHBOARD_PROXY_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "agentforge.fullname" . }}-secrets, key: AGENTFORGE_DASHBOARD_PROXY_SECRET } }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
