version: 1
policy_pack_id: platform-engineering
policy_pack_version: 1.0.0
agentforge:
  mode: warn
  apply_to:
    - all_pull_requests
sensitive_paths:
  ci_and_deploy:
    paths:
      - ".github/workflows/**"
      - "scripts/deploy/**"
      - "infra/prod/**"
      - "deployment/**"
      - "ci/**"
      - "buildkite/**"
      - ".circleci/**"
      - "Jenkinsfile"
    required_reviewers:
      - "platform-team"
    required_evidence:
      - "ci_change_reason"
      - "rollback_plan"
    block_for_agent_assisted: true
database:
  migrations:
    required_reviewers:
      - "database-owner"
    required_evidence:
      - "rollback_plan"
      - "migration_dry_run"
