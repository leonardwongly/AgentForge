version: 1
policy_pack_id: healthcare-regulated
policy_pack_version: 1.0.0
agentforge:
  mode: warn
  apply_to:
    - all_pull_requests
sensitive_paths:
  auth:
    paths:
      - "src/auth/**"
      - "services/identity/**"
    required_reviewers:
      - "security-team"
    required_evidence:
      - "security_note"
tests:
  deleted_tests:
    action: block
    mode: enforce
    required_evidence:
      - "deleted_test_explanation"
data_retention:
  source_code_storage: false
  full_diff_retention: "disabled"
  redact_secrets: true
  llm_features: false
  audit_record_retention: "2555d"
