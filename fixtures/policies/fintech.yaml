version: 1
policy_pack_id: fintech
policy_pack_version: 1.0.0
agentforge:
  mode: warn
  apply_to:
    - all_pull_requests
agent_assisted:
  stricter_controls: true
  detection_signals:
    - bot_author
    - branch_pattern
    - ai_label
    - commit_metadata
    - pr_body_marker
sensitive_paths:
  billing:
    paths:
      - "src/billing/**"
      - "src/checkout/**"
      - "services/payments/**"
    required_reviewers:
      - "billing-owner"
    required_evidence:
      - "rollback_plan"
  auth:
    paths:
      - "src/auth/**"
      - "services/identity/**"
    required_reviewers:
      - "security-team"
    required_evidence:
      - "security_note"
  ci_and_deploy:
    paths:
      - ".github/workflows/**"
      - "scripts/deploy/**"
      - "infra/prod/**"
    required_reviewers:
      - "platform-team"
    required_evidence:
      - "ci_change_reason"
    block_for_agent_assisted: true
tests:
  deleted_tests:
    action: block
    required_evidence:
      - "deleted_test_explanation"
  skipped_tests:
    action: block
    required_evidence:
      - "deleted_test_explanation"
dependencies:
  new_package:
    action: require_review
    required_reviewers:
      - "security-team"
    required_evidence:
      - "dependency_justification"
  major_version_bump:
    action: require_review
    required_reviewers:
      - "security-team"
database:
  migrations:
    paths:
      - "db/migrations/**"
      - "migrations/**"
      - "prisma/migrations/**"
    required_reviewers:
      - "database-owner"
    required_evidence:
      - "rollback_plan"
      - "migration_dry_run"
overrides:
  allowed_roles:
    - "engineering_manager"
    - "platform_admin"
  require_reason: true
  visible_in_pr: true
  audit: true
data_retention:
  source_code_storage: false
  full_diff_retention: "disabled"
  redact_secrets: true
  llm_features: false
  audit_record_retention: "365d"
