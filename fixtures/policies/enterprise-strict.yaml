version: 1
policy_pack_id: enterprise-strict
policy_pack_version: 1.0.0
agentforge:
  mode: enforce
  apply_to:
    - all_pull_requests
sensitive_paths:
  billing:
    paths:
      - "src/billing/**"
      - "src/checkout/**"
      - "services/payments/**"
    required_reviewers:
      - "billing-owner"
    required_evidence:
      - "rollback_plan"
  platform:
    paths:
      - ".github/workflows/**"
      - "scripts/deploy/**"
      - "infra/prod/**"
    required_reviewers:
      - "platform-team"
    required_evidence:
      - "ci_change_reason"
      - "rollback_plan"
tests:
  deleted_tests:
    action: block
    required_evidence:
      - "deleted_test_explanation"
dependencies:
  new_package:
    action: require_review
    required_reviewers:
      - "security-team"
    required_evidence:
      - "dependency_justification"
database:
  migrations:
    action: block
    required_reviewers:
      - "database-owner"
    required_evidence:
      - "rollback_plan"
      - "migration_dry_run"
