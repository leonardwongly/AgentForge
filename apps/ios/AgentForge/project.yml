name: AgentForge
options:
  bundleIdPrefix: com.leonardwongly
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AgentForgeCore:
    path: Packages/AgentForgeCore
targets:
  AgentForge:
    type: application
    platform: iOS
    sources:
      - path: Sources/AgentForgeApp
    dependencies:
      - package: AgentForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardwongly.agentforge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentForge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  AgentForge:
    build:
      targets:
        AgentForge: all
